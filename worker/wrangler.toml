name = "lucas-talk-with-me"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
# Free models only (":free" suffix); the worker drops anything else.
MODEL = "qwen/qwen3.8-27b:free,dots-studio/dots-3-note-preview:free,google/gemma-4-31b-it:free"
ALLOWED_ORIGINS = "https://lucasscellos.github.io,http://localhost:5173,http://localhost:4173"

# 10 messages per minute per IP, counted in a Durable Object (see RateLimiter).
[[durable_objects.bindings]]
name = "RATE_LIMITS"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# The OpenRouter key is a secret, never committed:
#   npx wrangler secret put OPENROUTER_API_KEY
# For local dev, put OPENROUTER_API_KEY=... in worker/.dev.vars (gitignored).
