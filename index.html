<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lucas Scellos — Lead AI Engineer</title>
    <meta name="description" content="Lucas Scellos, Lead AI Engineer at Theodo. I build the harnesses that make AI agents deliver reliably, and the infrastructure that serves LLMs at scale." />
    <meta name="author" content="Lucas Scellos" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Light by default; restore the visitor's choice before first paint (new key: ignores the old site's saved theme).
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme-v2'); } catch (e) {}
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
        document.documentElement.classList.add('js');
      })();
    </script>
    <!-- #root ships a plain-HTML copy of the content for crawlers and agents; React replaces it on mount. -->
    <style>
      .js .prerender { display: none; }
      .prerender { max-width: 760px; margin: 0 auto; padding: 2rem 16px; font-family: system-ui, sans-serif; line-height: 1.5; }
    </style>
    <link rel="canonical" href="https://lucasscellos.github.io/" />
    <link rel="icon" href="/images/ico.ico" sizes="any" />

    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Lucas Scellos" />
    <meta property="og:title" content="Lucas Scellos — Lead AI Engineer" />
    <meta property="og:description" content="I build the harnesses that make AI agents deliver reliably, and the infrastructure that serves LLMs at scale." />
    <meta property="og:url" content="https://lucasscellos.github.io/" />
    <meta property="og:image" content="https://lucasscellos.github.io/images/perso.jpeg" />
    <meta property="og:image:alt" content="Portrait of Lucas Scellos" />
    <meta property="og:locale" content="en_US" />
    <meta property="profile:first_name" content="Lucas" />
    <meta property="profile:last_name" content="Scellos" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lucas Scellos — Lead AI Engineer" />
    <meta name="twitter:description" content="I build the harnesses that make AI agents deliver reliably, and the infrastructure that serves LLMs at scale." />
    <meta name="twitter:image" content="https://lucasscellos.github.io/images/perso.jpeg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
    />

  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

</html>
